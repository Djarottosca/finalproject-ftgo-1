syntax = "proto3";

package payment.v1;

option go_package = "github.com/Djarottosca/finalproject-ftgo-1/proto/payment/v1;paymentv1";

import "google/protobuf/timestamp.proto";

// Di-implement oleh payment-service, dipanggil oleh core-service.
// Semua komunikasi lewat gRPC — payment-service tidak punya HTTP server.
// Sinyal "paid" ditemukan lewat polling GetPaymentStatus dari core (job Asynq),
// bukan lewat webhook.
service PaymentService {
  // Dipanggil core pas checkout: bikin payment session, balikin link bayar.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // Di-poll core sampai status berubah jadi PAID/EXPIRED/FAILED.
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (GetPaymentStatusResponse);

  // Khusus provider simulasi: memaksa pembayaran jadi PAID tanpa Xendit.
  // Balikin FAILED_PRECONDITION kalau provider aktif bukan simulasi.
  rpc SimulatePayment(SimulatePaymentRequest) returns (SimulatePaymentResponse);
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PAID = 2;
  PAYMENT_STATUS_EXPIRED = 3;
  PAYMENT_STATUS_FAILED = 4;
}

message CreatePaymentRequest {
  int64 order_id = 1;         // dikirim sebagai reference_id ke Xendit
  int64 user_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  int64 amount = 5;           // OTORITATIF. Rupiah utuh, integer, bukan float.
  string description = 6;
  repeated PaymentItem items = 7;   // opsional, display-only
  string idempotency_key = 8;       // opsional
}

message PaymentItem {
  string name = 1;
  int32 quantity = 2;
  int64 price = 3;
}

message CreatePaymentResponse {
  string payment_reference = 1;   // payment_session_id dari Xendit
  string payment_link = 2;        // payment_link_url dari Xendit
  PaymentStatus status = 3;       // PENDING pas baru dibuat
  google.protobuf.Timestamp expires_at = 4;  // session Xendit umurnya pendek (default 30 menit)
}

message GetPaymentStatusRequest {
  string payment_reference = 1;
}

message GetPaymentStatusResponse {
  string payment_reference = 1;
  int64 order_id = 2;
  PaymentStatus status = 3;
}

message SimulatePaymentRequest {
  string payment_reference = 1;
}

message SimulatePaymentResponse {
  string payment_reference = 1;
  int64 order_id = 2;
  PaymentStatus status = 3;   // PAID kalau sukses
}